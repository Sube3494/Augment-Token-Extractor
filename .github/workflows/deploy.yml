name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


jobs:
  vercel-deploy:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use Vercel CLI to pull env, build, and deploy (recommended production flow)
      - name: Vercel pull env
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: pnpm dlx vercel pull --yes --environment=production --token ${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: pnpm dlx vercel build --prod --token ${{ secrets.VERCEL_TOKEN }}

      - name: Vercel deploy (prebuilt)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: pnpm dlx vercel deploy --prebuilt --prod --token ${{ secrets.VERCEL_TOKEN }}

  cf-worker-deploy:
    name: Deploy Worker (Cloudflare)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Deploy with Wrangler
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: pnpm dlx wrangler deploy --config wrangler.toml

